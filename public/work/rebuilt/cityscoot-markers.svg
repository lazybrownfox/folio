<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
<rect width="1600" height="1000" fill="#f5f4ef"/>
<text x="48" y="56" fill="#12203a" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CITYSCOOT · MAP LAYER</text><text x="70" y="150" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="30" font-weight="700" text-anchor="start">Marker states</text><text x="70" y="182" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" text-anchor="start">One component, four readings — colour alone settles it.</text><rect x="70" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(172 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#2e9e5b"/><circle cx="0" cy="0" r="22.950000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 22.950000000000003 L-6.75 18.950000000000003 L6.75 18.950000000000003 Z" fill="#2e9e5b"/><text x="0" y="8.100000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24.3" font-weight="700" text-anchor="middle">C</text></g><text x="172" y="392" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Available</text><text x="172" y="416" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">battery above 30%</text><rect x="420" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(522 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#e0952f"/><circle cx="0" cy="0" r="22.950000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 22.950000000000003 L-6.75 18.950000000000003 L6.75 18.950000000000003 Z" fill="#e0952f"/><text x="0" y="8.100000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24.3" font-weight="700" text-anchor="middle">C</text></g><text x="522" y="392" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Low battery</text><text x="522" y="416" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">20–30%, short trip</text><rect x="770" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(872 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#8a93a4"/><circle cx="0" cy="0" r="22.950000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 22.950000000000003 L-6.75 18.950000000000003 L6.75 18.950000000000003 Z" fill="#8a93a4"/><text x="0" y="8.100000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24.3" font-weight="700" text-anchor="middle">C</text></g><text x="872" y="392" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Reserved</text><text x="872" y="416" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">held 15 min for a rider</text><rect x="1120" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(1222 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#c2c6cf"/><circle cx="0" cy="0" r="22.950000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 22.950000000000003 L-6.75 18.950000000000003 L6.75 18.950000000000003 Z" fill="#c2c6cf"/><text x="0" y="8.100000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24.3" font-weight="700" text-anchor="middle">C</text></g><text x="1222" y="392" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Out of service</text><text x="1222" y="416" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">maintenance or fault</text><rect x="70" y="580" width="640" height="300" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><text x="102" y="618" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="start">Clustering</text><text x="102" y="640" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Zoom out and the pins merge, carrying the count.</text><g transform="translate(180 750)"><circle cx="0" cy="14.45" r="11.899999999999999" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="17" fill="#2e9e5b"/><circle cx="0" cy="0" r="17" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 17 L-5 13 L5 13 Z" fill="#2e9e5b"/><text x="0" y="6" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">C</text></g><g transform="translate(230 732)"><circle cx="0" cy="14.45" r="11.899999999999999" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="17" fill="#2e9e5b"/><circle cx="0" cy="0" r="17" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 17 L-5 13 L5 13 Z" fill="#2e9e5b"/><text x="0" y="6" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">C</text></g><g transform="translate(212 788)"><circle cx="0" cy="14.45" r="11.899999999999999" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="17" fill="#2e9e5b"/><circle cx="0" cy="0" r="17" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 17 L-5 13 L5 13 Z" fill="#2e9e5b"/><text x="0" y="6" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">C</text></g><line x1="300" y1="760" x2="360" y2="760" stroke="#c9c6bd" stroke-width="2" stroke-linecap="round"/><path d="M352 754 l8 6 l-8 6" fill="none" stroke="#c9c6bd" stroke-width="2" stroke-linecap="round"/><g transform="translate(450 760)"><circle cx="0" cy="27.455" r="22.609999999999996" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="32.3" fill="#2e9e5b"/><circle cx="0" cy="0" r="32.3" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 32.3 L-9.5 28.299999999999997 L9.5 28.299999999999997 Z" fill="#2e9e5b"/><text x="0" y="11.399999999999999" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="34.199999999999996" font-weight="700" text-anchor="middle">12</text></g><text x="560" y="766" fill="#8a93a4" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="start">cluster</text><rect x="760" y="580" width="770" height="300" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><text x="792" y="618" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="start">Pin geometry</text><text x="792" y="640" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">A 44px tap target, held at every scale.</text><circle cx="900" cy="760" r="44" fill="none" stroke="#1f5fd6" stroke-width="1.4" stroke-dasharray="5 5"/><g transform="translate(900 760)"><circle cx="0" cy="23.12" r="19.04" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="27.200000000000003" fill="#2e9e5b"/><circle cx="0" cy="0" r="27.200000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 27.200000000000003 L-8 23.200000000000003 L8 23.200000000000003 Z" fill="#2e9e5b"/><text x="0" y="9.600000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="28.8" font-weight="700" text-anchor="middle">C</text></g><line x1="856" y1="830" x2="944" y2="830" stroke="#1f5fd6" stroke-width="1.4" stroke-linecap="round"/><text x="900" y="854" fill="#1f5fd6" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" text-anchor="middle">44 px</text><text x="1010" y="736" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· a soft drop shadow, never a hard outline</text><text x="1010" y="764" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· colour carries the state, the number the density</text><text x="1010" y="792" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· the glyph stays legible from 24px</text><text x="48" y="960" fill="#12203a" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" text-anchor="start" letter-spacing="1.4" opacity="0.38">RECONSTRUCTION · MARKER SYSTEM</text>
</svg>