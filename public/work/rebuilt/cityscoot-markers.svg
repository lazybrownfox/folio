<text x="48" y="56" fill="#12203a" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">CITYSCOOT · COUCHE CARTO</text><text x="70" y="150" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="30" font-weight="700" text-anchor="start">États du marqueur</text><text x="70" y="182" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="400" text-anchor="start">Un seul composant, quatre lectures — la couleur suffit à trancher.</text><rect x="70" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(172 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#2e9e5b"/><circle cx="0" cy="0" r="22.950000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 22.950000000000003 L-6.75 18.950000000000003 L6.75 18.950000000000003 Z" fill="#2e9e5b"/><text x="0" y="8.100000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="24.3" font-weight="700" text-anchor="middle">C</text></g><text x="172" y="392" fill="#12203a" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="middle">Disponible</text><text x="172" y="416" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="400" text-anchor="middle">batterie &gt; 30 %</text><rect x="420" y="250" width="300" height="200" rx="14" fill="#fff" stroke="#e6e4dd" stroke-width="1"/><g transform="translate(522 330)"><circle cx="0" cy="19.5075" r="16.065" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="22.950000000000003" fill="#e0952f"/><circle cx="0" cy="0" r="22.9