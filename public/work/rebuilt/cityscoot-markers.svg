in</text><text x="792" y="640" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Cible tactile de 44 px conservée à toutes les échelles.</text><circle cx="900" cy="760" r="44" fill="none" stroke="#1f5fd6" stroke-width="1.4" stroke-dasharray="5 5"/><g transform="translate(900 760)"><circle cx="0" cy="23.12" r="19.04" fill="#000" opacity="0.14"/><circle cx="0" cy="0" r="27.200000000000003" fill="#2e9e5b"/><circle cx="0" cy="0" r="27.200000000000003" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1"/><path d="M0 27.200000000000003 L-8 23.200000000000003 L8 23.200000000000003 Z" fill="#2e9e5b"/><text x="0" y="9.600000000000001" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="28.8" font-weight="700" text-anchor="middle">C</text></g><line x1="856" y1="830" x2="944" y2="830" stroke="#1f5fd6" stroke-width="1.4" stroke-linecap="round"/><text x="900" y="854" fill="#1f5fd6" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" text-anchor="middle">44 px</text><text x="1010" y="736" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· ombre portée légère, jamais de contour dur</text><text x="1010" y="764" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· la couleur porte l’état, le chiffre la densité</text><text x="1010" y="792" fill="#8a93a4" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">· le glyphe reste lisible dès 24 px</text><text x="48" y="960" fill="#12203a" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" text-anchor="start" letter-spacing="1.4" opacity="0.38">RECONSTRUCTION · SYSTÈME DE MARQUEURS</text>
