<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700" role="img">
<rect width="1600" height="700" fill="#ede7dc"/>
<text x="48" y="56" fill="#141210" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="2">NAB-BRIDGE · HARDWARE &amp; NETWORK</text><rect x="70" y="130" width="700" height="500" rx="14" fill="#fff" stroke="#e2ded3" stroke-width="1"/><text x="98" y="168" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="start">Audio signal path</text><text x="98" y="196" fill="#8a8274" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="start">Mac (nab-bridge) → tunnel → TagTagTag audio HAT → speaker</text><text x="98" y="246" fill="#c0392b" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">NATIVE RATES</text><path d="M98 290 L115.85714285714286 302.0316779816791 L133.71428571428572 285.02267519643726 L151.57142857142856 281.0060001787179 L169.42857142857144 298.9171727162259 L187.28571428571428 301.8969362847732 L205.14285714285714 272.91814669537445 L223 279.5267470850145 L240.85714285714286 302.10965192269066 L258.7142857142857 304.95865765329864 L276.57142857142856 277.88089346537294 L294.42857142857144 287.04648255664983 L312.2857142857143 294.01573444267035 L330.1428571428571 287.83752504597663 L348 277.90610221106476 L365.8571428571429 303.9469337833041 L383.7142857142857 302.1471846608326 L401.57142857142856 279.89410663380954 L419.42857142857144 273.40821580890673 L437.2857142857143 301.76673429589704 L455.14285714285717 299.3968111883971 L473 280.0843950842418 L490.8571428571429 284.3112618401516 L508.7142857142857 302.05264625774447 L526.5714285714286 291.78780789774794 L544.4285714285714 277.9847131039704 L562.2857142857142 294.23913801353314 L580.1428571428571 298.1100098110751 L598 281.60370581798423" fill="none" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/><circle cx="710" cy="280" r="11" fill="#c0392b"/><text x="710" y="284" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✕</text><text x="98" y="326" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="400" text-anchor="start">44.1 / 22.05 / 11.025 kHz — faulty PLL on the wm8960 codec</text><text x="98" y="376" fill="#3f7d5c" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="start" letter-spacing="1.2">SERVED RATES</text><path d="M98 420 L115.85714285714286 429.3999229155298 L133.71428571428572 431.68617157053836 L151.57142857142856 425.12855856280595 L169.42857142857144 414.68975468046176 L187.28571428571428 408.26963858801884 L205.14285714285714 410.72682614932813 L223 420.2017668058122 L240.85714285714286 429.5240143661898 L258.7142857142857 431.638677730141 L276.57142857142856 424.9454218229011 L294.42857142857144 414.50956927469616 L312.2857142857143 408.2287652392021 L330.1428571428571 410.8561969929716 L348 420.40347656665364 L365.8571428571429 429.64541311861944 L383.7142857142857 431.58789331859134 L401.57142857142856 424.7608868775674 L419.42857142857144 414.3309361632184 L437.2857142857143 408.1912199390203 L455.14285714285717 410.9881530387399 L473 420.6050722536818 L490.8571428571429 429.7640848500853 L508.7142857142857 431.5338326940254 L526.5714285714286 424.57500589985926 L544.4285714285714 414.1539058504739 L562.2857142857142 408.15701330255223 L580.1428571428571 411.12265697906525 L598 420.8064968703057" fill="none" stroke="#3f7d5c" stroke-width="2" stroke-linecap="round"/><circle cx="710" cy="410" r="11" fill="#3f7d5c"/><text x="710" y="414" fill="#fff" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">✓</text><text x="98" y="456" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="400" text-anchor="start">48 / 32 / 16 / 8 kHz — clean on the same hardware</text><line x1="98" y1="490" x2="742" y2="490" stroke="#eceae4" stroke-width="1" stroke-linecap="round"/><text x="98" y="526" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Fix: every clip is resampled to 48 kHz CBR before playback —</text><text x="98" y="548" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">never VBR (the old mpg123 decoder segfaults on it).</text><text x="98" y="588" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Diagnosed and shipped as a permanent bridge setting,</text><text x="98" y="610" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">not a one-off workaround.</text><rect x="830" y="130" width="700" height="500" rx="14" fill="#fff" stroke="#e2ded3" stroke-width="1"/><text x="858" y="168" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="700" text-anchor="start">Network path</text><text x="858" y="196" fill="#8a8274" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" text-anchor="start">a lapin reachable from a Mac, without exposing anything to Wi-Fi</text><rect x="870" y="270" width="220" height="84" rx="10" fill="#f7f6f2" stroke="#e2ded3" stroke-width="1"/><text x="890" y="304" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="start">Mac · nab-bridge</text><text x="890" y="328" fill="#8a8274" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="start">127.0.0.1:10544</text><rect x="1270" y="270" width="220" height="84" rx="10" fill="#f7f6f2" stroke="#e2ded3" stroke-width="1"/><text x="1290" y="304" fill="#141210" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14.5" font-weight="700" text-anchor="start">Raspberry Pi · nabd</text><text x="1290" y="328" fill="#8a8274" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="start">127.0.0.1:10543</text><line x1="1090" y1="312" x2="1270" y2="312" stroke="#c9a26a" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="1180" cy="312" r="5" fill="#c9a26a"/><text x="1180" y="296" fill="#c9a26a" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="middle" letter-spacing="1.2">SSH TUNNEL</text><text x="1180" y="338" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="11.5" font-weight="400" text-anchor="middle">bidirectional · key-based</text><line x1="858" y1="430" x2="1502" y2="430" stroke="#eceae4" stroke-width="1" stroke-linecap="round"/><text x="858" y="462" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Both services bind 127.0.0.1 only — never the LAN.</text><text x="858" y="494" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">safeFetch rejects local/private destinations before any download.</text><text x="858" y="526" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Redirects are revalidated; requests time out at 30s.</text><text x="858" y="558" fill="#8a8274" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="400" text-anchor="start">Downloads capped at 250 MB (podcasts) / 5 MB (RSS).</text><text x="48" y="660" fill="#141210" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" font-weight="400" text-anchor="start" letter-spacing="1.4" opacity="0.38">RECONSTRUCTION · SIGNAL &amp; NETWORK SCHEMATIC</text>
</svg>